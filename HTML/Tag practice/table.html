<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=  , initial-scale=1.0" />
    <title>Document</title>

    <style>
      table,
      td,
      th,
      tr {
        border: 1px solid black;
        border-collapse: collapse;
      }
    </style>
  </head>
  <body>
    <table>
      <caption>
        My First Saving
      </caption>
      <thead>
        <tr>
          <th>Month</th>
          <th>Savings</th>
        </tr>
      </thead>

      <tbody>
        <tr>
          <td>January</td>
          <td>100</td>
        </tr>
        <tr>
          <td>Feb</td>
          <td>200</td>
        </tr>

        <tr>
          <td>Mar</td>
          <td>300</td>
        </tr>

        <tr>
          <td>April</td>
          <td>400</td>
        </tr>

        <tr>
          <td>May</td>
          <td>500</td>
        </tr>
      </tbody>

      <tfoot>
        <tr>
          <td>Total</td>
          <td>1500</td>
        </tr>
      </tfoot>
    </table>
  </body>
</html>
